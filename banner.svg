<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#18140f" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0b464" />
      <stop offset="50%" stop-color="#f5d696" />
      <stop offset="100%" stop-color="#e0b464" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#e0b464" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottom" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e17" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14110d" stop-opacity="0.9" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 52px;
      fill: #f5f1ea;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #e0b464;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 21px;
      fill: #d5cdbf;
    }
    .tech-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f5f1ea;
    }
    .wave-bar {
      transform-origin: bottom;
      animation: pulse 2.2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.1); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#2e2820" stroke-width="1.5" />
  <rect width="1200" height="380" rx="16" fill="url(#glowTop)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowBottom)" />

  <!-- Subtle Grid/Accent Line -->
  <line x1="100" y1="40" x2="1100" y2="40" stroke="#e0b464" stroke-opacity="0.15" stroke-dasharray="6 6" />
  <line x1="100" y1="340" x2="1100" y2="340" stroke="#e0b464" stroke-opacity="0.15" stroke-dasharray="6 6" />

  <!-- Main Container -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -115)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1c1813" stroke="#e0b464" stroke-opacity="0.5" stroke-width="1.2" />
      <circle cx="-110" cy="0" r="4" fill="#e0b464" />
      <text x="5" y="4.5" class="badge-text">✦ SLOW SIGNALS PODCAST ✦</text>
    </g>

    <!-- Main Title with Mic Icon -->
    <g transform="translate(0, -45)">
      <!-- Animated Sound Waves on Left -->
      <g transform="translate(-290, -8)" fill="#e0b464">
        <rect x="-18" y="-12" width="4" height="24" rx="2" opacity="0.4" class="wave-bar" style="animation-delay: 0.1s" />
        <rect x="-10" y="-22" width="4" height="44" rx="2" opacity="0.7" class="wave-bar" style="animation-delay: 0.3s" />
        <rect x="-2" y="-32" width="4" height="64" rx="2" opacity="1.0" class="wave-bar" style="animation-delay: 0.5s" />
        <rect x="6" y="-18" width="4" height="36" rx="2" opacity="0.6" class="wave-bar" style="animation-delay: 0.2s" />
        <rect x="14" y="-8" width="4" height="16" rx="2" opacity="0.4" class="wave-bar" style="animation-delay: 0.4s" />
      </g>

      <!-- Title Text -->
      <text x="0" y="8" class="title">
        Slow Signals <tspan fill="url(#goldGrad)">Podcast</tspan>
      </text>

      <!-- Animated Sound Waves on Right -->
      <g transform="translate(290, -8)" fill="#e0b464">
        <rect x="-18" y="-8" width="4" height="16" rx="2" opacity="0.4" class="wave-bar" style="animation-delay: 0.4s" />
        <rect x="-10" y="-18" width="4" height="36" rx="2" opacity="0.6" class="wave-bar" style="animation-delay: 0.2s" />
        <rect x="-2" y="-32" width="4" height="64" rx="2" opacity="1.0" class="wave-bar" style="animation-delay: 0.5s" />
        <rect x="6" y="-22" width="4" height="44" rx="2" opacity="0.7" class="wave-bar" style="animation-delay: 0.3s" />
        <rect x="14" y="-12" width="4" height="24" rx="2" opacity="0.4" class="wave-bar" style="animation-delay: 0.1s" />
      </g>
    </g>

    <!-- Tagline -->
    <text x="0" y="10" class="tagline">
      Conversations on craft, culture, and the art of paying attention
    </text>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(0, 75)">
      <!-- Pill 1: Next.js 15 -->
      <g transform="translate(-280, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="url(#cardGrad)" stroke="#2e2820" stroke-width="1" />
        <text x="0" y="5" class="tech-pill">⚡ Next.js 15 App</text>
      </g>
      <!-- Pill 2: Static Export -->
      <g transform="translate(-95, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="8" fill="url(#cardGrad)" stroke="#2e2820" stroke-width="1" />
        <text x="0" y="5" class="tech-pill">🚀 Static SSG Export</text>
      </g>
      <!-- Pill 3: Clean Code -->
      <g transform="translate(95, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="8" fill="url(#cardGrad)" stroke="#2e2820" stroke-width="1" />
        <text x="0" y="5" class="tech-pill">💎 Clean Architecture</text>
      </g>
      <!-- Pill 4: WCAG AA -->
      <g transform="translate(280, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="url(#cardGrad)" stroke="#2e2820" stroke-width="1" />
        <text x="0" y="5" class="tech-pill">♿ WCAG 2.1 AA</text>
      </g>
    </g>
  </g>
</svg>
